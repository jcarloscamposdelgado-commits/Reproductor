<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reproductor</title>

<style>
body{
margin:0;
background:black;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial, sans-serif;
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:8px;
background:#d4af37;
color:black;
cursor:pointer;
}
</style>
</head>

<body>

<button id="btn">▶ Iniciar música</button>

<audio id="audio"></audio>

<script>
const tracks = [
  "LLOVIENDO EN EL SALÓN_spotdown.org.mp3",
  "Un extraño en el país de los recuerdos (feat. Barroso)_spotdown.org.mp3",
  "VUELVO A SER YO_spotdown.org.mp3",
  "Y Ahora_spotdown.org.mp3"
].map(t => encodeURI(t));

let index = 0;
const audio = document.getElementById("audio");
const btn = document.getElementById("btn");

btn.addEventListener("click", () => {
  if(audio.paused){
    playTrack();
    btn.textContent = "⏸ Pausar música";
  } else {
    audio.pause();
    btn.textContent = "▶ Iniciar música";
  }
});

function playTrack(){
  audio.src = tracks[index];
  audio.play().catch(e => console.log(e));
}

audio.addEventListener("ended", () => {
  index = (index + 1) % tracks.length;
  playTrack();
});
</script>

</body>
</html>
